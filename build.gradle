plugins {
    id 'net.minecraftforge.gradle' version '6.0.18'
}

group = project.property('maven_group')
version = project.property('mod_version')
archivesBaseName = project.property('archives_base_name')

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = "https://files.minecraftforge.net/maven"
    }
}

ext.minecraft {
    version = project.property('minecraft_version')
    mappings = 'official'
    runDir = 'run'
}

ext.minecraft.runs.client {
    property 'forge.logging.markers', 'REGISTRIES'
}

dependencies {
    minecraft 'net.minecraftforge:forge:${project.property('forge_version')}-${project.property('minecraft_version')}'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.property('minecraft_version')
}
